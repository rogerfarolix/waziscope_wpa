server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP : app shell + Google Fonts + thumbnails CDN
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' blob: https:; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Static assets: cache agressif ────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── manifest.json / sw.js : pas de cache (mis à jour régulièrement) ──────
    location ~* (manifest\.json|sw\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── Vue Router / Laravel : HTML5 history mode ────────────────────────────
    # Toutes les requêtes non-fichier tombent sur index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM (service "app" dans le réseau Docker) ────────────────────────
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeouts généreux pour les extractions longues
        fastcgi_read_timeout  120s;
        fastcgi_send_timeout  120s;

        # Buffers
        fastcgi_buffer_size        16k;
        fastcgi_buffers            4 32k;
    }

    # ── Bloquer l'accès aux fichiers sensibles ────────────────────────────────
    location ~ /\.(ht|env|git) {
        deny all;
    }
}
