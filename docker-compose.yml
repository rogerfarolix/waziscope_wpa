version: "3.9"

services:

  # ─── Service Python FastAPI ───────────────────────────────────────────────────
  # IMPORTANT: pas de `ports:` ici — l'extractor est un service INTERNE.
  # Laravel l'atteint via le réseau Docker waziscope-net à http://extractor:8032.
  extractor:
    build:
      context: ./extractor
      dockerfile: Dockerfile
    container_name: waziscope-extractor
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - waziscope-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8032/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── Laravel App ──────────────────────────────────────────────────────────────
  app:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: waziscope-laravel
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    environment:
      - APP_ENV=production
      - WAZISCOPE_EXTRACTOR_URL=http://extractor:8032
    depends_on:
      extractor:
        condition: service_healthy
    networks:
      - waziscope-net

  # ─── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: waziscope-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./laravel/public:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - waziscope-net

networks:
  waziscope-net:
    driver: bridge
